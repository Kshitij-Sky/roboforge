# RoboForge — Isaac Lab 3.0 external project.
# Packaging layout and the [tool.uv] block are adapted from the Isaac Lab external-project
# template as used by robot_lab v3.0.0 (Copyright (c) 2022-2026, The Isaac Lab Project
# Developers, BSD-3-Clause). Expected workspace (scripts/setup_workspace.*):
#
#   <workspace>/IsaacLab   (v3.0.0)
#   <workspace>/robot_lab  (v3.0.0)
#   <workspace>/roboforge  (this repo)
#
# STATUS: dependency resolution not yet verified — first `uv sync` happens in P0 (TRACKER.md).

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "roboforge"
version = "0.0.1"
description = "CAD-to-real locomotion RL pipeline for wheeled-legged quadrupeds (and later humanoids), built on Isaac Lab 3.0."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab-dev",
    "robot_lab",
    "numpy>=2",
    "pyyaml",
]

[project.entry-points."isaaclab.tasks"]
roboforge = "roboforge.tasks"

[project.optional-dependencies]
importers = ["isaaclab-dev[importers]"]   # kit-less URDF/MJCF -> USD conversion
ovphysx = ["isaaclab-dev[ovphysx]"]       # kit-less PhysX (cross-engine check)
ov = ["isaaclab-dev[ov]"]
rsl-rl = ["isaaclab-dev[rsl-rl]"]
video = ["isaaclab-dev[video]"]
viser = ["isaaclab-dev[viser]"]
rerun = ["isaaclab-dev[rerun]"]
wandb = ["isaaclab-dev[wandb]"]
isaacsim = ["isaaclab-dev[isaacsim]"]     # full Isaac Sim — NOT used on the 8 GB laptop

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.14.10"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# Version pins required by Isaac Lab 3.0.0 (mirrors robot_lab v3.0.0).
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]

[tool.uv.sources]
"robot_lab" = { path = "../robot_lab", editable = true }
"isaaclab" = { path = "../IsaacLab/source/isaaclab", editable = true }
"isaaclab-assets" = { path = "../IsaacLab/source/isaaclab_assets", editable = true }
"isaaclab-contrib" = { path = "../IsaacLab/source/isaaclab_contrib", editable = true }
"isaaclab-dev" = { path = "../IsaacLab", editable = true }
"isaaclab-experimental" = { path = "../IsaacLab/source/isaaclab_experimental", editable = true }
"isaaclab-mimic" = { path = "../IsaacLab/source/isaaclab_mimic", editable = true }
"isaaclab-newton" = { path = "../IsaacLab/source/isaaclab_newton", editable = true }
"isaaclab-ov" = { path = "../IsaacLab/source/isaaclab_ov", editable = true }
"isaaclab-physx" = { path = "../IsaacLab/source/isaaclab_physx", editable = true }
"isaaclab-ppisp" = { path = "../IsaacLab/source/isaaclab_ppisp", editable = true }
"isaaclab-rl" = { path = "../IsaacLab/source/isaaclab_rl", editable = true }
"isaaclab-tasks" = { path = "../IsaacLab/source/isaaclab_tasks", editable = true }
"isaaclab-tasks-experimental" = { path = "../IsaacLab/source/isaaclab_tasks_experimental", editable = true }
"isaaclab-teleop" = { path = "../IsaacLab/source/isaaclab_teleop", editable = true }
"isaaclab-visualizers" = { path = "../IsaacLab/source/isaaclab_visualizers", editable = true }
"omniverseclient" = { index = "pypi-public" }
"ovphysx" = { index = "pypi-public" }
"ovrtx" = { index = "pypi-public" }
"ovstage" = { index = "pypi-public" }
"torch" = { index = "pytorch-cu130" }
"torchvision" = { index = "pytorch-cu130" }

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.build-backend]
module-name = "roboforge"
module-root = "src"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["logs", "outputs", "robots/*/build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "RET"]
ignore = ["E402", "RET504", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
